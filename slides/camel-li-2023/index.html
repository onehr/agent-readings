<!-- .slide: class="code-slide" -->

<div class="slide-frame">
  <p class="deck-kicker">Executable shape</p>
  <h2>The mechanism should fit on one screen.</h2>

```python
roles = generate_roles()
idea = generate_or_receive_idea()
task = task_specifier(roles, idea)

ai_user = LLM(system_prompt=user_inception_prompt(roles, task))
ai_assistant = LLM(system_prompt=assistant_inception_prompt(roles, task))
messages = []

for turn in range(max_messages):
    instruction = ai_user(messages)
    if instruction == "CAMEL_TASK_DONE" or violates_protocol(instruction):
        break
    solution = ai_assistant(messages, instruction)
    if role_flip(solution) or token_limit_reached(solution):
        break
    messages.append({"instruction": instruction, "solution": solution})
```

<!-- .slide: class="takeaway-slide" -->

<div class="slide-frame">
  <p class="deck-kicker">Agent infrastructure</p>
  <h2>What changes if you build systems.</h2>
  <div class="apple-card-grid apple-card-grid--two">
    <div class="apple-card"><p>Role prompts are protocol definitions. CAMEL's guardrails are essentially a communication contract between agents.</p></div>
<div class="apple-card"><p>A multi-agent dialogue loop needs termination policy before it needs more agents. Role flipping and infinite loops are runtime bugs.</p></div>
<div class="apple-card"><p>Synthetic agent conversations are a data engine. CAMEL's biggest infrastructure lesson is that agent-agent traces can become training and evaluation...</p></div>
<div class="apple-card"><p>Separate planner and executor roles. The AI user decides what to ask next; the AI assistant executes the instruction.</p></div>
  </div>
</div>

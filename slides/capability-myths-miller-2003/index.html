<!-- .slide: class="statement-slide" -->

<div class="slide-frame">
  <p class="deck-kicker">The one sentence</p>
  <h2>Capability Myths Demolished argues that object-capability systems are not just ACLs in another notation: they better support least privilege, delegation, confinement, revocation, and confused-deputy avoidance.</h2>
  <p class="deck-note">For agents, capabilities are the permission model that sandboxing needs: an agent should not merely be 'running in a box'; it should hold only the specific authority tokens needed for the next action.</p>
</div>

<div class="slide-frame">
  <p class="deck-kicker">Before this paper</p>
  <h2>The friction was structural.</h2>
  <div class="apple-card-grid apple-card-grid--three">
    <div class="apple-card"><p>Access-control-list systems bind authority to subjects, identities, and objects, often relying on ambient authority.</p></div>
<div class="apple-card"><p>Capability systems were frequently dismissed through three myths: equivalence with ACLs, inability to enforce confinement, and inability to revoke access.</p></div>
<div class="apple-card"><p>Different papers used different meanings of capability, creating confusion between access-matrix rows, key-like capabilities, and object capabilities.</p></div>
  </div>
  <div class="deck-callout">
    <span>Key gap</span>
    <p>The paper asks whether common objections to capability systems are valid once the object-capability model is distinguished from weaker or misleading capability interpretations.</p>

<!-- .slide: class="code-slide" -->

<div class="slide-frame">
  <p class="deck-kicker">Executable shape</p>
  <h2>The mechanism should fit on one screen.</h2>

```python
class Revoker:
    def __init__(self, target):
        self.target = target
        self.enabled = True

    def call(self, request):
        if not self.enabled:
            raise PermissionError("revoked")
        return self.target.call(request)

    def revoke(self):
        self.enabled = False

# Grant only attenuated authority.
read_only_file = ReadOnlyWrapper(file_capability)
revocable = Revoker(read_only_file)
agent_tool = Tool(file=revocable.call)

# Later:
revocable.revoke()
```

<!-- .slide: class="takeaway-slide" -->

<div class="slide-frame">
  <p class="deck-kicker">Agent infrastructure</p>
  <h2>What changes if you build systems.</h2>
  <div class="apple-card-grid apple-card-grid--two">
    <div class="apple-card"><p>An agent permission should be an object it holds, not a row in a global ACL checked against the agent's broad identity.</p></div>
<div class="apple-card"><p>Tool calls should receive attenuated capabilities: read this file, post to this endpoint, spend up to this amount, for this run id.</p></div>
<div class="apple-card"><p>Revocation requires indirection. If an agent receives a raw credential, later policy changes may be too late.</p></div>
<div class="apple-card"><p>Capabilities reduce confused-deputy risk because the tool must be invoked with the specific authority for the specific resource, not ambient user...</p></div>
  </div>
</div>

<!-- .slide: class="caveat-slide" -->

<div class="slide-frame">
  <p class="deck-kicker">Caveats</p>
  <h2>What this does not prove.</h2>
  <div class="apple-card-grid apple-card-grid--two">
    <div class="apple-card"><p>The paper is conceptual and model-driven, not an empirical benchmark.</p></div>
<div class="apple-card"><p>Object-capability reasoning assumes references are unforgeable and communication paths are controlled.</p></div>
<div class="apple-card"><p>Capabilities do not eliminate all covert channels or all logic bugs.</p></div>
<div class="apple-card"><p>Revocation must be designed before direct authority leaks; after a raw capability is copied, revocation can be difficult.</p></div>
  </div>
</div>

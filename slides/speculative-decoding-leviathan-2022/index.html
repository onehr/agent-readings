<div class="slide-frame">
  <p class="deck-kicker">The one sentence</p>
  <h2>Speculative decoding uses a faster draft model to propose several tokens, then verifies them with the slow target model in parallel so generation accelerates without changing the target distribution.</h2>
  <p class="deck-note">For agents, per-step latency compounds across tool loops, search, debate, retries, and self-consistency. Speculative decoding attacks the wall-clock cost of every generation without requiring a new target model.</p>

  <div class="apple-card-grid apple-card-grid--three">
    <div class="apple-card"><p>Generating K tokens from an autoregressive Transformer normally requires K serial target-model invocations.</p></div>
<div class="apple-card"><p>Large target-model decode steps are slow and often limited by memory bandwidth or communication rather than raw arithmetic.</p></div>
<div class="apple-card"><p>Adaptive computation methods can speed some cases but often require architecture changes, retraining, or accept changed output distributions.</p></div>
  </div>
  <div class="deck-callout">
    <span>Key gap</span>

<!-- .slide: class="code-slide" -->

<div class="slide-frame">
  <p class="deck-kicker">Executable shape</p>
  <h2>The mechanism should fit on one screen.</h2>

```python
while not done:
    draft = []
    ctx = prefix
    for i in range(gamma):
        token = sample(q(. | ctx))
        draft.append(token)
        ctx += token

    p_scores = target_model.score(prefix + draft)

    accepted = []
    for i, token in enumerate(draft):
        if random() <= min(1, p_scores[i][token] / q_score(i, token)):
            accepted.append(token)
        else:
            correction = sample(residual(p_scores[i], q_score(i)))
            prefix += accepted + [correction]
            break
    else:
        bonus = sample(p_scores_next)
        prefix += accepted + [bonus]
```

<!-- .slide: class="takeaway-slide" -->

<div class="slide-frame">
  <p class="deck-kicker">Agent infrastructure</p>
  <h2>What changes if you build systems.</h2>
  <div class="apple-card-grid apple-card-grid--two">
    <div class="apple-card"><p>Speculative decoding is a latency primitive for agent loops: every model call can return faster without changing the requested target distribution.</p></div>
<div class="apple-card"><p>The draft model becomes serving infrastructure. It must be co-located, versioned, monitored, and chosen per target/workload.</p></div>
<div class="apple-card"><p>Exactness matters for agent reliability. Speculative decoding's appeal is preserving outputs, not merely making a cheaper model answer first.</p></div>
<div class="apple-card"><p>Speedup depends on acceptance rate. Hard reasoning, long-tail domains, or mismatched draft models can reduce gains.</p></div>
  </div>
</div>

<!-- .slide: class="caveat-slide" -->

<div class="slide-frame">
  <p class="deck-kicker">Caveats</p>
  <h2>What this does not prove.</h2>
  <div class="apple-card-grid apple-card-grid--two">
    <div class="apple-card"><p>The method needs a useful approximation model; a weak draft model can waste work.</p></div>
<div class="apple-card"><p>The target distribution is preserved only if the sampling rule and probabilities are implemented exactly.</p></div>
<div class="apple-card"><p>The headline 2x-3x speedup is workload/model/implementation-specific.</p></div>
<div class="apple-card"><p>Speculative decoding reduces latency but does not reduce the semantic number of agent decisions.</p></div>
  </div>
</div>

<!-- .slide: class="idea-slide" -->

<div class="slide-frame">
  <p class="deck-kicker">Core idea</p>
  <h2>Use the simplest control pattern that satisfies the task.</h2>
  <p class="deck-note">Use the simplest control pattern that satisfies the task. Start with a direct augmented LLM call, move to fixed workflows when decomposition is predictable, and reserve autonomous agents for open-ended tasks where the model must choose steps and tools over...</p>
  <div class="idea-loop" aria-label="Agent loop">
    <div><strong>Model</strong><span>reason</span></div>
    <div><strong>Runtime</strong><span>act</span></div>
    <div><strong>World</strong><span>observe</span></div>
  </div>
  <div class="step-strip">
    <div class="step-item">
  <span>01</span>
  <p>Find the simplest solution, often a single LLM call with retrieval or examples.</p>
</div>
<div class="step-item">
  <span>02</span>
  <p>If a task decomposes cleanly, implement a fixed workflow with checks or routing.</p>
</div>
<div class="step-item">
  <span>03</span>
  <p>If subtasks cannot be predicted in advance, let an orchestrator or agent dynamically decompose the task.</p>
</div>
<div class="step-item">
  <span>04</span>
  <p>For autonomous agents, keep environment feedback, sandbox testing, guardrails, and stopping conditions explicit.</p>
</div>

<div class="slide-frame">
  <p class="deck-kicker">Agent infrastructure</p>
  <h2>What changes if you build systems.</h2>
  <div class="apple-card-grid apple-card-grid--two">
    <div class="apple-card"><p>Separate workflows from agents in the runtime API. Fixed code paths and model-directed control flow need different observability and safety...</p></div>
<div class="apple-card"><p>Treat complexity as a cost: every extra loop, branch, worker, or evaluator should have an evaluation reason to exist.</p></div>
<div class="apple-card"><p>The augmented LLM is the reusable substrate; retrieval, memory, and tools should be documented as model-facing capabilities, not hidden implementation...</p></div>
<div class="apple-card"><p>Agent loops need environment observations, human checkpoints, sandbox tests, guardrails, and stopping conditions as first-class runtime concepts.</p></div>

<!-- .slide: class="statement-slide" -->

<div class="slide-frame">
  <p class="deck-kicker">The one sentence</p>
  <h2>MCP standardizes the protocol surface between AI applications and external context, tools, prompts, and client-mediated capabilities.</h2>
  <p class="deck-note">Agent infrastructure needs an interface contract. MCP gives hosts, clients, and servers a shared JSON-RPC vocabulary for discovery, invocation, context access, user prompts, and permission-sensitive client features.</p>
</div>

---

<!-- .slide: class="problem-slide" -->

<div class="slide-frame">
  <p class="deck-kicker">Before this paper</p>
  <h2>The friction was structural.</h2>
  <div class="apple-card-grid apple-card-grid--three">
    <div class="apple-card"><p>LLM applications often used bespoke tool schemas, plugin manifests, local subprocess wrappers, or host-specific integration APIs.</p></div>
<div class="apple-card"><p>A tool or data connector written for one host did not reliably compose with another host.</p></div>
<div class="apple-card"><p>Tool calling, context injection, user prompts, and local filesystem scoping were mixed into application-specific conventions.</p></div>
  </div>
  <div class="deck-callout">
    <span>Key gap</span>
    <p>The protocol asks how AI applications can discover and use external context and capabilities through a common client-server contract without prescribing the application shell or agent algorithm.</p>
  </div>
</div>

---

<!-- .slide: class="idea-slide" -->

<div class="slide-frame">
  <p class="deck-kicker">Core idea</p>
  <h2>Split an AI integration into a host, one client connection per server, and server/client capabilities negotiated at initialization; use JSON-RPC methods for...</h2>
  <p class="deck-note">Split an AI integration into a host, one client connection per server, and server/client capabilities negotiated at initialization; use JSON-RPC methods for listing, retrieving, invoking, and notifying changes.</p>
  <div class="idea-loop" aria-label="Agent loop">
    <div><strong>Model</strong><span>reason</span></div>
    <div><strong>Runtime</strong><span>act</span></div>
    <div><strong>World</strong><span>observe</span></div>
  </div>
  <div class="step-strip">
    <div class="step-item">
  <span>01</span>
  <p>A host application starts or connects to an MCP server through stdio, Streamable HTTP, or another compliant transport.</p>
</div>
<div class="step-item">
  <span>02</span>
  <p>The host instantiates an MCP client for that server and negotiates capabilities during initialization.</p>
</div>
<div class="step-item">
  <span>03</span>
  <p>The client discovers server-provided resources, prompts, and tools with list methods and pagination where supported.</p>
</div>
<div class="step-item">
  <span>04</span>
  <p>The host chooses how to display or insert resources and prompts into the model context.</p>
</div>

</div>

<!-- .slide: class="grammar-slide" -->

<div class="slide-frame">
  <p class="deck-kicker">Action grammar</p>
  <h2>The agent is an interface contract.</h2>
  <div class="apple-card-grid apple-card-grid--two">
    <div class="apple-card"><p>Initialize: client and server negotiate protocol version and supported capabilities.</p></div>
<div class="apple-card"><p>List resources/prompts/tools: the client asks a server what context, prompt templates, or functions it exposes.</p></div>
<div class="apple-card"><p>Read resource: the client requests URI-addressed context from a server.</p></div>
<div class="apple-card"><p>Get prompt: the client retrieves a parameterized prompt template for explicit user use.</p></div>
  </div>
</div>

<!-- .slide: class="code-slide" -->

<div class="slide-frame">
  <p class="deck-kicker">Executable shape</p>
  <h2>The mechanism should fit on one screen.</h2>

```python
client = host.connect_mcp_server(server)
capabilities = client.initialize(protocol_version)

resources = client.request("resources/list")
prompts = client.request("prompts/list")
tools = client.request("tools/list")

context = host.select_resources(resources)
choice = model.decide(user_task, context, tools)
if choice.kind == "tool_call" and host.user_approves(choice):
    result = client.request("tools/call", choice.name, choice.arguments)

if server.requests_sampling and host.user_approves_sampling():
    response = host.run_model(server_sampling_request)
```
</div>

<!-- .slide: class="takeaway-slide" -->

<div class="slide-frame">
  <p class="deck-kicker">Agent infrastructure</p>
  <h2>What changes if you build systems.</h2>
  <div class="apple-card-grid apple-card-grid--two">
    <div class="apple-card"><p>MCP is the agent-tool driver model: the goal is to make connectors reusable across hosts instead of embedding each tool into one application.</p></div>
<div class="apple-card"><p>Server primitives should be stored separately in review data: resources are context, prompts are reusable workflows, and tools are side-effecting...</p></div>
<div class="apple-card"><p>Client primitives matter because they move sensitive actions back through the host: roots, sampling, and elicitation all require host/user policy...</p></div>
<div class="apple-card"><p>The protocol boundary is not the security boundary. Serious agent runtimes still need sandboxing, capability grants, audit logs, and consent UX.</p></div>
  </div>
</div>

<!-- .slide: class="caveat-slide" -->

<div class="slide-frame">
  <p class="deck-kicker">Caveats</p>
  <h2>What this does not prove.</h2>
  <div class="apple-card-grid apple-card-grid--two">
    <div class="apple-card"><p>This is a specification and documentation corpus, not an empirical paper with benchmark results.</p></div>
<div class="apple-card"><p>MCP changes over time; this review is anchored to the 2025-06-18 protocol revision while the README entry is dated by the 2024 launch.</p></div>
<div class="apple-card"><p>The spec standardizes protocol shape, not context-ranking algorithms, model routing, tool planning, or workflow execution semantics.</p></div>
<div class="apple-card"><p>Security outcomes depend on host and client implementation. The spec explicitly notes that MCP itself cannot enforce the security principles.</p></div>
  </div>
</div>

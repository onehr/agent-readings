<!-- .slide: class="statement-slide" -->

<div class="slide-frame">
  <p class="deck-kicker">The one sentence</p>
  <h2>Indirect prompt injection lets an attacker hide instructions in content that an LLM application later retrieves, causing the model to treat untrusted data as control input.</h2>
  <p class="deck-note">For agents, this is the confused-deputy problem in natural language. The model acts with the user's authority while consuming text controlled by other parties.</p>
</div>

---

<!-- .slide: class="problem-slide" -->

<div class="slide-frame">
  <p class="deck-kicker">Before this paper</p>
  <h2>The friction was structural.</h2>
  <div class="apple-card-grid apple-card-grid--three">
    <div class="apple-card"><p>Early prompt-injection discussions mostly assumed the attacker directly prompts their own model session.</p></div>
<div class="apple-card"><p>LLM-integrated applications increasingly retrieve webpages, documents, emails, code, and search results at inference time.</p></div>
<div class="apple-card"><p>Agents and application-integrated LLMs can call tools or APIs on behalf of a user.</p></div>
  </div>
  <div class="deck-callout">
    <span>Key gap</span>
    <p>The paper asks what happens when the attacker is not the user, but controls data that the user's LLM application will later retrieve and process.</p>
  </div>
</div>

<div class="slide-frame">
  <p class="deck-kicker">Executable shape</p>
  <h2>The mechanism should fit on one screen.</h2>

```python
attacker.publish(content_with_hidden_instruction)

user.ask(agent, task)
retrieved = search_or_tool_fetch(task)
context = trusted_system_prompt + user_task + retrieved

action = llm(context)
if action.calls_tool:
    tool.execute(action, user_authority)

# The attacker did not prompt the model directly; retrieved data crossed the control boundary.
```

<!-- .slide: class="takeaway-slide" -->

<div class="slide-frame">
  <p class="deck-kicker">Agent infrastructure</p>
  <h2>What changes if you build systems.</h2>
  <div class="apple-card-grid apple-card-grid--two">
    <div class="apple-card"><p>Treat retrieved content as hostile data, never as authority-bearing instructions.</p></div>
<div class="apple-card"><p>A model should not be the only boundary between untrusted text and privileged tools.</p></div>
<div class="apple-card"><p>Tool calls need capability scoping, confirmation, policy checks, audit logs, and least privilege independent of prompt intent.</p></div>
<div class="apple-card"><p>Memory can make prompt injection persistent; stored notes and retrieved history need the same distrust as webpages or emails.</p></div>
  </div>
</div>

<div class="slide-frame">

  <h2>What this does not prove.</h2>
  <div class="apple-card-grid apple-card-grid--two">
    <div class="apple-card"><p>Many demonstrations are qualitative proof-of-concepts rather than statistically measured benchmark results.</p></div>
<div class="apple-card"><p>The real-world systems tested were black boxes and have changed since 2023.</p></div>
<div class="apple-card"><p>The paper intentionally avoided seeding public sources with live malicious prompts for ethical reasons.</p></div>
<div class="apple-card"><p>Some mitigations and product defenses have improved since publication, but no general clean fix is established by the paper.</p></div>

<!-- .slide: class="statement-slide" -->

<div class="slide-frame">
  <p class="deck-kicker">The one sentence</p>
  <h2>Toolformer teaches a language model to insert and consume API calls by sampling possible calls, executing them, and keeping only those that reduce next-token loss.</h2>
  <p class="deck-note">Toolformer is the bridge from hand-written tool-use prompts to tool-use data pipelines: APIs become textual actions, execution results become training signals, and tool invocation becomes part of the language model's decoding loop.</p>
</div>

<div class="slide-frame">

  <h2>The friction was structural.</h2>
  <div class="apple-card-grid apple-card-grid--three">
    <div class="apple-card"><p>Large language models could follow instructions and solve many text tasks, but still struggled with arithmetic, factual lookup, translation, and temporal awareness.</p></div>
<div class="apple-card"><p>Earlier tool-use approaches often depended on human annotations or task-specific prompting where the user already knew which tool should be used.</p></div>
<div class="apple-card"><p>A general-purpose tool-using LM needs to decide when to call a tool, which tool to call, what arguments to pass, and how to use the result without losing ordinary...</p></div>

  <div class="deck-callout">
    <span>Key gap</span>

<!-- .slide: class="grammar-slide" -->

<div class="slide-frame">
  <p class="deck-kicker">Action grammar</p>
  <h2>The agent is an interface contract.</h2>
  <div class="apple-card-grid apple-card-grid--two">
    <div class="apple-card"><p>API call: a textual tuple containing an API name and input argument.</p></div>
<div class="apple-card"><p>API result: a single text sequence returned by the external tool.</p></div>
<div class="apple-card"><p>Candidate sampler: the base LM prompted to propose where and how to call an API.</p></div>
<div class="apple-card"><p>Usefulness filter: a weighted loss comparison over future tokens with and without the API result.</p></div>
  </div>
</div>

<!-- .slide: class="code-slide" -->

<div class="slide-frame">
  <p class="deck-kicker">Executable shape</p>
  <h2>The mechanism should fit on one screen.</h2>

```python
augmented = []
for text in corpus:
    candidates = sample_api_calls(model, text, tool_prompts)
    kept = []
    for call in candidates:
        result = execute(call)
        if loss_with_result(model, text, call, result) < loss_without_result(model, text, call):
            kept.append((call, result))
    augmented.append(interleave(text, kept))
finetune(model, augmented)
```
</div>

<!-- .slide: class="takeaway-slide" -->

<div class="slide-frame">
  <p class="deck-kicker">Agent infrastructure</p>
  <h2>What changes if you build systems.</h2>
  <div class="apple-card-grid apple-card-grid--two">
    <div class="apple-card"><p>Tool use begins with a protocol: every tool must have a textual call format, a textual result format, and examples showing intended use.</p></div>
<div class="apple-card"><p>The loss filter is an early form of execution-derived supervision: a runtime can log which calls actually reduce uncertainty or improve downstream...</p></div>
<div class="apple-card"><p>Tool invocation needs an execution boundary in decoding. The model can propose calls, but infrastructure must pause, authorize, execute, insert...</p></div>
<div class="apple-card"><p>The paper's single-call setup is not enough for agent workflows; multi-step plans require trajectories, dependency tracking, and loop prevention.</p></div>
  </div>
</div>

<!-- .slide: class="caveat-slide" -->

<div class="slide-frame">
  <p class="deck-kicker">Caveats</p>
  <h2>What this does not prove.</h2>
  <div class="apple-card-grid apple-card-grid--two">
    <div class="apple-card"><p>Toolformer is finetuned for a fixed set of tools, not a dynamic tool-discovery protocol.</p></div>
<div class="apple-card"><p>The method needs executable tools during data generation and inference.</p></div>
<div class="apple-card"><p>The paper's main downstream setup permits at most one API call per input.</p></div>
<div class="apple-card"><p>Loss reduction is a local proxy for usefulness and does not encode user authorization, safety, or side-effect policy.</p></div>
  </div>
</div>

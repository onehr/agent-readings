<div class="slide-frame">
  <p class="deck-kicker">The one sentence</p>
  <h2>GAIA evaluates general AI assistants with concise, factoid real-world questions that are easy for humans but require AI systems to browse, reason, handle multimodal evidence, and use tools accurately.</h2>
  <p class="deck-note">For agents, GAIA is a clean benchmark of compound assistant behavior: the answer is usually short, but reaching it requires correct tool use, web navigation, evidence synthesis, and exact formatting.</p>

<div class="apple-card"><p>evidence: optional image, document, web page, or clue used to answer.</p></div>
<div class="apple-card"><p>tools: browser, search, code, calculator, multimodal parser, or other assistant capability.</p></div>
<div class="apple-card"><p>answer string: final concise response checked against ground truth.</p></div>

<!-- .slide: class="code-slide" -->

<div class="slide-frame">
  <p class="deck-kicker">Executable shape</p>
  <h2>The mechanism should fit on one screen.</h2>

```python
for question in gaia:
    evidence = question.attachments_or_web_context
    agent_trace = agent.solve(question.prompt, tools=[browser, code, calculator, vision])
    answer = normalize(agent_trace.final_answer)
    success = exact_or_rule_match(answer, question.ground_truth)
    record(success, level=question.level)
```
</div>

<!-- .slide: class="takeaway-slide" -->

<div class="slide-frame">
  <p class="deck-kicker">Agent infrastructure</p>
  <h2>What changes if you build systems.</h2>
  <div class="apple-card-grid apple-card-grid--two">
    <div class="apple-card"><p>GAIA is a clean assistant benchmark because the final answer is short but the path is operationally complex.</p></div>
<div class="apple-card"><p>Tool-use evaluation should ask whether the tool was needed and used correctly, not merely whether the model can name a tool.</p></div>
<div class="apple-card"><p>Concise factoid answers make grading cheaper and less judge-dependent than free-form reports.</p></div>
<div class="apple-card"><p>The human-vs-AI gap is useful because these are not expert-only tasks; they measure robustness on ordinary information work.</p></div>
  </div>
</div>

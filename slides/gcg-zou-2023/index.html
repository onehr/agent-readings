<div class="slide-frame">
  <p class="deck-kicker">The one sentence</p>
  <h2>GCG showed that adversarial suffixes can be automatically optimized on open models and transfer to other aligned LLMs, including black-box systems.</h2>
  <p class="deck-note">For agents, this means model refusal is not a hard security boundary. Tool authority, sandboxing, policy checks, and output controls must not rely solely on the model staying aligned under adversarial input.</p>

<div class="apple-card"><p>Automatic adversarial prompt generation had limited success against aligned chat models.</p></div>

  <span>E-universal-method</span>
  <p>The paper optimizes one suffix over multiple prompts and aggregates losses/gradients across multiple models to improve universality and transfer.</p>

<!-- .slide: class="takeaway-slide" -->

<div class="slide-frame">
  <p class="deck-kicker">Agent infrastructure</p>
  <h2>What changes if you build systems.</h2>
  <div class="apple-card-grid apple-card-grid--two">
    <div class="apple-card"><p>Do not use model refusal as the only security boundary for a tool-using agent.</p></div>
<div class="apple-card"><p>Adversarial prompt testing should be part of agent evaluation, especially before granting tools, memory writes, or external side effects.</p></div>
<div class="apple-card"><p>Transfer attacks mean closed-source or black-box deployment does not eliminate risk if similar open models can be used as surrogates.</p></div>
<div class="apple-card"><p>Safety filters should be layered with capability scoping, sandboxing, output validation, policy enforcement, and human approval for sensitive actions.</p></div>
  </div>
</div>

<div class="slide-frame">

    <div class="apple-card"><p>The paper intentionally studies objectionable-content elicitation, not every possible alignment objective.</p></div>
<div class="apple-card"><p>Attack success depends on model version, interface, decoding parameters, and provider patches; reported numbers are historical.</p></div>
<div class="apple-card"><p>The review intentionally omits attack strings and runnable optimization details.</p></div>
<div class="apple-card"><p>Harmful-behavior evaluation involves human judgment about attempted compliance.</p></div>

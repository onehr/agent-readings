  <h2>MemGPT treats the context window as RAM and external stores as disk, then gives the model functions for paging memory in and out.</h2>
  <p class="deck-note">The paper turns memory from a retrieval add-on into runtime state. For agent infrastructure, the key move is that memory operations become logged, inspectable actions with their own policy and failure modes.</p>

<div class="slide-frame">

  <h2>The friction was structural.</h2>
  <div class="apple-card-grid apple-card-grid--three">
    <div class="apple-card"><p>Fixed context windows limit long conversations and document analysis.</p></div>
<div class="apple-card"><p>Blindly extending context is expensive because attention cost grows quadratically and long-context models may still fail to use middle context reliably.</p></div>
<div class="apple-card"><p>Naive summarization loses details that a later agent step may need.</p></div>
  </div>
  <div class="deck-callout">
    <span>Key gap</span>
    <p>The paper asks how to make a fixed-context model behave as if it had larger, persistent memory without retraining the model or increasing the context window.</p>

  <p class="deck-note">Wrap a fixed-context LLM in an OS-like runtime that stores prompt-resident state in main context, out-of-context state in recall and archival storage, and exposes memory-management functions the model can call.</p>

  <span>01</span>
  <p>Store static instructions, writable working memory, and recent events in main context.</p>
</div>

</div>
<div class="step-item">

</div>

<!-- .slide: class="grammar-slide" -->

<div class="slide-frame">
  <p class="deck-kicker">Action grammar</p>
  <h2>The agent is an interface contract.</h2>
  <div class="apple-card-grid apple-card-grid--two">
    <div class="apple-card"><p>Incoming event: user message, system message, timed event, document upload, or memory-pressure alert.</p></div>
<div class="apple-card"><p>Main context: system instructions, working context, and FIFO queue are concatenated into the prompt.</p></div>
<div class="apple-card"><p>Memory warning: queue manager warns the model before context overflow.</p></div>
<div class="apple-card"><p>Memory edit: the model writes durable facts to working context or archival storage.</p></div>

<!-- .slide: class="code-slide" -->

<div class="slide-frame">
  <p class="deck-kicker">Executable shape</p>
  <h2>The mechanism should fit on one screen.</h2>

```python
for event in event_stream:
    queue.append(render(event))
    recall_storage.write(event)

    if prompt_tokens(queue, working_context) > warning_threshold:
        queue.append(system_memory_pressure_warning())

    while true:
        output = llm(system_instructions, working_context, queue)
        if output.is_memory_function():
            result = execute_memory_function(output)
            queue.append(result)
            if output.request_heartbeat:
                continue
        else:
            recall_storage.write(output)
            send_to_user(output)
        break

    if prompt_tokens(queue, working_context) > flush_threshold:
        evicted = queue.flush_old_messages()
        recall_storage.write(evicted)
        queue.summary = summarize(queue.summary, evicted)
```

<!-- .slide: class="takeaway-slide" -->

<div class="slide-frame">
  <p class="deck-kicker">Agent infrastructure</p>
  <h2>What changes if you build systems.</h2>
  <div class="apple-card-grid apple-card-grid--two">
    <div class="apple-card"><p>A context window is main memory, not durable memory. Persistent agent state needs explicit storage tiers and movement rules.</p></div>
<div class="apple-card"><p>Memory actions should be first-class runtime events: search, write, flush, summarize, page, and heartbeat all need logs and policy.</p></div>
<div class="apple-card"><p>Memory pressure is a useful control signal. Long-running agents should know before context eviction happens, not after facts disappear.</p></div>
<div class="apple-card"><p>The memory manager is only as reliable as the base model's function-calling and stopping behavior.</p></div>
  </div>
</div>

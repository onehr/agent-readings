<!-- .slide: class="statement-slide" -->

<div class="slide-frame">
  <p class="deck-kicker">The one sentence</p>
  <h2>DBOS argues that a distributed transactional DBMS should be the substrate for cluster operating-system services, so execution state becomes queryable, transactional, and highly available by construction.</h2>
  <p class="deck-note">For agents, the DBOS idea is the systems ancestor of 'every step is a durable write': if task state, messages, retries, and results live in a transactional store, an agent trajectory becomes recoverable and inspectable instead of ephemeral control flow.</p>
</div>

<!-- .slide: class="grammar-slide" -->

<div class="slide-frame">
  <p class="deck-kicker">Action grammar</p>
  <h2>The agent is an interface contract.</h2>
  <div class="apple-card-grid apple-card-grid--two">
    <div class="apple-card"><p>Task table: records task id, partition key, worker assignment, and scheduling metadata.</p></div>
<div class="apple-card"><p>Worker table: records worker id, partition key, and unused task capacity.</p></div>
<div class="apple-card"><p>Message table: records sender, receiver, message id, and message data.</p></div>
<div class="apple-card"><p>Localized file table: stores file blocks local to one database partition.</p></div>

<!-- .slide: class="code-slide" -->

<div class="slide-frame">
  <p class="deck-kicker">Executable shape</p>
  <h2>The mechanism should fit on one screen.</h2>

```python
Task(p_key, task_id, worker_id, priority, created_at)
Worker(p_key, worker_id, unused_capacity)
Message(sender_id, receiver_id, message_id, data)

schedule(task):
    worker = select worker_id from Worker
             where unused_capacity > 0 and p_key = task.home_partition
             order by unused_capacity desc
             limit 1
    if worker:
        update Worker set unused_capacity = unused_capacity - 1 where worker_id = worker
        insert into Task values(task.partition, task.id, worker, ...)
    else:
        insert into Task values(task.home_partition, task.id, null, ...)

send(sender, receiver, id, data):
    insert into Message values(sender, receiver, id, data)

receive(receiver):
    msg = select * from Message where receiver_id = receiver order by message_id limit 1
    delete from Message where receiver_id = receiver and message_id = msg.id
    return msg
```
</div>

<!-- .slide: class="takeaway-slide" -->

<div class="slide-frame">
  <p class="deck-kicker">Agent infrastructure</p>
  <h2>What changes if you build systems.</h2>
  <div class="apple-card-grid apple-card-grid--two">
    <div class="apple-card"><p>Agent execution state should be first-class data, not hidden call stack state. DBOS gives the cleanest systems argument for that choice.</p></div>
<div class="apple-card"><p>A scheduler table is a natural shape for agent work: task id, worker, capacity, retry budget, priority, lease, and provenance can all be queried.</p></div>
<div class="apple-card"><p>An agent message bus backed by transactions can make observations, tool results, and handoffs replayable and deduplicatable.</p></div>
<div class="apple-card"><p>SQL observability is not a side feature. If trajectories are rows, debugging is a query instead of log archaeology.</p></div>
  </div>
</div>

<!-- .slide: class="caveat-slide" -->

<div class="slide-frame">
  <p class="deck-kicker">Caveats</p>
  <h2>What this does not prove.</h2>
  <div class="apple-card-grid apple-card-grid--two">
    <div class="apple-card"><p>DBOS-straw is a prototype, not a full production operating system.</p></div>
<div class="apple-card"><p>The paper demonstrates basic OS services, not LLM-agent runtimes directly.</p></div>
<div class="apple-card"><p>IPC performance is not universally better; TCP is substantially faster in the reported benchmarks.</p></div>
<div class="apple-card"><p>Database invocation overhead is visible in read-heavy filesystem workloads.</p></div>

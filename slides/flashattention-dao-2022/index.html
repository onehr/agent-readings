<div class="slide-frame">
  <p class="deck-kicker">The one sentence</p>
  <h2>FlashAttention makes exact attention fast by tiling the computation so the quadratic attention matrix is never materialized in slow GPU HBM.</h2>
  <p class="deck-note">For agents, every serving-layer gain compounds across long contexts and many calls; FlashAttention is the kernel-level reason longer prompts and cheaper serving became practical.</p>

<div class="slide-frame">
  <p class="deck-kicker">Before this paper</p>
  <h2>The friction was structural.</h2>
  <div class="apple-card-grid apple-card-grid--three">
    <div class="apple-card"><p>Self-attention has quadratic time and memory complexity in sequence length.</p></div>
<div class="apple-card"><p>Approximate attention methods reduce theoretical compute but often fail to improve wall-clock time or reduce quality.</p></div>
<div class="apple-card"><p>Standard attention materializes the N by N attention matrix and moves it through GPU HBM, making memory traffic a bottleneck.</p></div>
  </div>
  <div class="deck-callout">
    <span>Key gap</span>
    <p>The paper asks how to compute exact attention with fewer HBM reads/writes by explicitly designing for the GPU memory hierarchy.</p>

<!-- .slide: class="idea-slide" -->

<div class="slide-frame">
  <p class="deck-kicker">Core idea</p>
  <h2>Load blocks of Q, K, and V into SRAM, compute attention tile by tile with online softmax, write only final outputs and small normalization state to HBM, and...</h2>
  <p class="deck-note">Load blocks of Q, K, and V into SRAM, compute attention tile by tile with online softmax, write only final outputs and small normalization state to HBM, and recompute tiles during backward rather than storing the whole attention matrix.</p>
  <div class="idea-loop" aria-label="Agent loop">
    <div><strong>Model</strong><span>reason</span></div>
    <div><strong>Runtime</strong><span>act</span></div>
    <div><strong>World</strong><span>observe</span></div>
  </div>
  <div class="step-strip">
    <div class="step-item">
  <span>01</span>
  <p>Partition Q, K, and V into blocks sized for GPU SRAM.</p>
</div>
<div class="step-item">
  <span>02</span>
  <p>Loop over K/V blocks and Q blocks, loading only the active tiles into SRAM.</p>
</div>
<div class="step-item">
  <span>03</span>
  <p>Compute local attention scores for the tile.</p>
</div>
<div class="step-item">
  <span>04</span>
  <p>Update online softmax statistics and accumulated outputs without storing the full N by N score matrix.</p>
</div>

<!-- .slide: class="grammar-slide" -->

<div class="slide-frame">
  <p class="deck-kicker">Action grammar</p>
  <h2>The agent is an interface contract.</h2>
  <div class="apple-card-grid apple-card-grid--two">
    <div class="apple-card"><p>Q block: tile of query vectors loaded into SRAM.</p></div>
<div class="apple-card"><p>K/V block: tile of key/value vectors loaded into SRAM.</p></div>
<div class="apple-card"><p>score tile: local QK^T product computed in SRAM.</p></div>
<div class="apple-card"><p>normalization state: running max and denominator needed for stable softmax across tiles.</p></div>
  </div>
</div>

<!-- .slide: class="code-slide" -->

<div class="slide-frame">
  <p class="deck-kicker">Executable shape</p>
  <h2>The mechanism should fit on one screen.</h2>

```python
for kv_block in blocks(K, V):
    K_sram, V_sram = load_to_sram(kv_block)
    for q_block in blocks(Q):
        Q_sram = load_to_sram(q_block)
        scores = Q_sram @ K_sram.T
        m_new, l_new, acc_new = online_softmax_update(scores, V_sram, state[q_block])
        state[q_block] = (m_new, l_new, acc_new)

for q_block in blocks(Q):
    write_hbm(output[q_block], normalize(state[q_block]))

# Backward recomputes score tiles instead of loading a saved N x N attention matrix.
```
</div>

<!-- .slide: class="takeaway-slide" -->

<div class="slide-frame">
  <p class="deck-kicker">Agent infrastructure</p>
  <h2>What changes if you build systems.</h2>
  <div class="apple-card-grid apple-card-grid--two">
    <div class="apple-card"><p>Serving improvements start at the kernel. Agent workflows become cheaper when the primitive attention operation stops wasting HBM bandwidth.</p></div>
<div class="apple-card"><p>FLOPs are not the whole cost model. For long-context agents, memory traffic and KV residency often dominate.</p></div>
<div class="apple-card"><p>FlashAttention is exact, so it can improve throughput/latency without changing model semantics the way approximate attention might.</p></div>
<div class="apple-card"><p>Longer context is an infrastructure feature. It changes what agents can carry in prompt state, tool traces, and retrieval context.</p></div>
  </div>
</div>

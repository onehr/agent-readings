  <h2>CoALA turns language agents into a cognitive-architecture design problem by separating memory modules, internal and external actions, and a looping decision procedure.</h2>
  <p class="deck-note">For agent infrastructure, CoALA names the runtime pieces that need explicit interfaces: working state, long-term stores, tool/environment grounding, retrieval, reasoning, learning, and the top-level decision loop.</p>

<div class="apple-card"><p>Newer agents added reasoning, planning, reflection, retrieval, and memory, but papers used inconsistent names for similar mechanisms.</p></div>
<div class="apple-card"><p>Traditional cognitive architectures had mature notions of working memory, long-term memory, grounding, learning, and decision cycles, but required hand-specified symbolic rules.</p></div>

<!-- .slide: class="grammar-slide" -->

<div class="slide-frame">
  <p class="deck-kicker">Action grammar</p>
  <h2>The agent is an interface contract.</h2>
  <div class="apple-card-grid apple-card-grid--two">
    <div class="apple-card"><p>Grounding action: external interaction such as robot control, web navigation, API use, or communication.</p></div>
<div class="apple-card"><p>Retrieval action: read from long-term memory into working memory.</p></div>
<div class="apple-card"><p>Reasoning action: use the LLM to update working memory with inferred facts, plans, critiques, or candidate actions.</p></div>
<div class="apple-card"><p>Learning action: write experience, knowledge, code, prompts, or parameters into long-term memory.</p></div>
  </div>
</div>

<!-- .slide: class="code-slide" -->

<div class="slide-frame">
  <p class="deck-kicker">Executable shape</p>
  <h2>The mechanism should fit on one screen.</h2>

```python
while true:
    working_memory.update(observe_environment())
    candidates = reason_and_retrieve(working_memory, long_term_memory)
    selected = select_action(candidates)
    if selected.kind == "grounding":
        working_memory.update(environment.step(selected))
    elif selected.kind == "learning":
        long_term_memory.write(selected)
```
</div>

<!-- .slide: class="caveat-slide" -->

<div class="slide-frame">
  <p class="deck-kicker">Caveats</p>
  <h2>What this does not prove.</h2>
  <div class="apple-card-grid apple-card-grid--two">
    <div class="apple-card"><p>CoALA is primarily a conceptual framework and survey, not a new empirical agent with benchmark results.</p></div>
<div class="apple-card"><p>The framework does not by itself solve safety, permissions, persistence, or exactly-once execution for side-effecting agents.</p></div>
<div class="apple-card"><p>The paper's categories are intentionally broad, so implementations still need concrete interface contracts and failure handling.</p></div>
<div class="apple-card"><p>Autonomous updates to source code, retrieval, learning, or decision-making are flagged as risky and underexplored.</p></div>

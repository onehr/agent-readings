<div class="slide-frame">
  <p class="deck-kicker">The one sentence</p>
  <h2>Tulu 3 is an open post-training recipe that combines data curation, SFT, length-normalized DPO, RL with verifiable rewards, decontamination, and staged evaluation.</h2>
  <p class="deck-note">For agent training, Tulu 3 is the bridge from RLHF/DPO to verifiable-reward training: it shows how to use exact checks for math and instruction-following, while documenting the operational costs and failure modes of doing that at scale.</p>

<!-- .slide: class="code-slide" -->

<div class="slide-frame">
  <p class="deck-kicker">Executable shape</p>
  <h2>The mechanism should fit on one screen.</h2>

```python
base = load_llama31(size)

evals = build_eval_suite(dev_tasks, unseen_tasks)
data = decontaminate(curate_public_and_synthetic_data(), evals)

sft = train_sft(base, data.sft_mix, loss="sum", epochs=2)
prefs = generate_on_policy_preferences(sft, data.preference_prompts)
dpo = train_dpo_norm(sft, prefs)

for prompt in data.rlvr_prompts:
    completion = sample(dpo, prompt)
    reward = 10 if verifier(prompt, completion) else 0
    dpo = ppo_update(dpo, reward, kl_to_ref=true)

return evaluate(dpo, evals.dev, evals.unseen)
```

<!-- .slide: class="takeaway-slide" -->

<div class="slide-frame">
  <p class="deck-kicker">Agent infrastructure</p>
  <h2>What changes if you build systems.</h2>
  <div class="apple-card-grid apple-card-grid--two">
    <div class="apple-card"><p>Open recipes need artifacts, not just weights. The reusable contribution is data, code, evals, decontamination, intermediate checkpoints, and...</p></div>
<div class="apple-card"><p>Verifiable rewards are the agent-training hinge: when a task has an executable checker, reward generation moves from human-time to compute-time.</p></div>
<div class="apple-card"><p>Evaluation should be part of the training loop from day one, with development tasks separated from unseen tasks.</p></div>
<div class="apple-card"><p>Post-training is a distributed systems problem at scale: rollout engines, learner GPUs, weight sync, stale data, hardware failures, and loss semantics...</p></div>
  </div>
</div>
